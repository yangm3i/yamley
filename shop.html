<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>yam — shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=National+Park:wght@200..800&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:   #FAF9F7;
      --ink:     #1A1A1A;
      --rose:    #9FB8C3;
      --sage:    #B5C4B1;
      --sand:    #D4C5A9;
      --blush:   #CDE3ED;
      --soft-grey: #C4C4C4;
      --sage-light: #DCE6D9;
      --sage-dark: #A3B89D;
      --font:    'Roboto Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: var(--font);
      font-weight: 300;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 48px;
      background: #FFFFFF;
      border-bottom: 1px solid #DDDDDD;
      transition: border-color 0.3s;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink);
    }
    .nav-logo img {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }
    .nav-logo span {
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: lowercase;
      font-weight: 400;
    }

    .nav-links {
      display: flex;
      gap: 10px;
      list-style: none;
    }
    .nav-links a {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: lowercase;
      text-decoration: none;
      color: var(--ink);
      opacity: 0.85;
      padding: 6px 16px;
      background: #FFFFFF;
      border-top: 1.5px solid #FFFFFF;
      border-left: 1.5px solid #FFFFFF;
      border-bottom: 1.5px solid var(--soft-grey);
      border-right: 1.5px solid var(--soft-grey);
      border-radius: 8px;
      transition: opacity 0.15s, background 0.15s;
    }
    .nav-links a:hover { opacity: 1; }
    .nav-links a.active {
      opacity: 1;
      background: var(--sage-light);
      border-top: 1.5px solid var(--sage-dark);
      border-left: 1.5px solid var(--sage-dark);
      border-bottom: 1.5px solid #FFFFFF;
      border-right: 1.5px solid #FFFFFF;
    }

    /* ── SECTION SHARED ── */
    section { padding: 96px 48px; }

    .section-label {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.4;
      margin-bottom: 12px;
    }

    /* ── SHOP ── */
    .shop-page-wrap {
      padding-top: 80px;
    }
    .shop {
      max-width: 1200px;
      margin: 0 auto;
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .shop h1 {
      font-size: clamp(28px, 4vw, 46px);
      font-weight: 200;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }
    .shop p {
      font-size: 14px;
      opacity: 0.55;
      letter-spacing: 0.05em;
    }

    /* masonry-ish grid (for when products are added) */
    .grid {
      columns: 3;
      column-gap: 20px;
      width: 100%;
    }
    @media (max-width: 900px) { .grid { columns: 2; } }
    @media (max-width: 560px) { .grid { columns: 1; } }

    .grid-item {
      break-inside: avoid;
      margin-bottom: 20px;
      overflow: hidden;
      position: relative;
    }
    .grid-item .swatch {
      width: 100%;
      display: block;
      border-radius: 2px;
    }
    .grid-item .caption {
      padding: 10px 0 4px;
      font-size: 11px;
      letter-spacing: 0.12em;
      opacity: 0.45;
      text-transform: lowercase;
    }

    /* ── FOOTER ── */
    footer {
      background: #FFFFFF;
      color: var(--ink);
      border-top: 1px solid #DDDDDD;
      text-align: center;
      padding: 24px 48px;
      font-size: 10px;
      letter-spacing: 0.15em;
      opacity: 0.4;
    }

    /* ── REVEAL ANIMATION ── */
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 600px) {
      nav { padding: 16px 20px; }
      .nav-links { gap: 20px; }
      section { padding: 64px 20px; }
    }
  </style>
</head>
<body>

<nav id="nav">
  <a class="nav-logo" href="home.html">
    <img src="images/icons/yam clover - cropped.png" style="opacity:1;" alt="yam logo" />
  </a>
  <ul class="nav-links">
    <li><a href="home.html">Home</a></li>
    <li><a href="shop.html" class="active">Shop</a></li>
    <li><a href="work.html">Work</a></li>
    <li><a href="about.html">About</a></li>
  </ul>
</nav>

<div class="shop-page-wrap">
  <section id="shop">
    <div class="shop reveal">
      <div class="section-label">shop</div>
      <h1>products coming soon</h1>
      <p>check back soon for ceramics, prints, and other handmade things.</p>
    </div>
  </section>
</div>

<footer>
  <img src="images/logo-ink.png" alt="yam logo" style="height:14px; width:auto; vertical-align:middle; margin-right:6px; opacity:0.75;" />yamley &nbsp;·&nbsp; digital media scrapbook
</footer>

<script>
  const nav = document.getElementById('nav');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 40);
  });
  const observer = new IntersectionObserver(
    entries => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); }),
    { threshold: 0.12 }
  );
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>

</body>
</html>
